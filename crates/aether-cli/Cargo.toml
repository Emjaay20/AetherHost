[package]
name = "aether-cli"
version = "0.1.0"
edition = "2021"
description = "Official Developer CLI for AetherHost PaaS"

[dependencies]
aether-core = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
tokio = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
colored = "2.1"
comfy-table = "7.1"
indicatif = "0.17"
dirs = "5.0"

[[bin]]
name = "aether"
path = "src/main.rs"

[[bin]]
name = "aether-cli"
path = "src/main.rs"
