[workspace]
members = [
    "aether-core",
    "aether-authz",
    "aether-telemetry",
    "aether-cli",
    "aether-logd",
    "aether-router",
]
resolver = "2"

[workspace.dependencies]
aether-core = { path = "aether-core" }
aether-authz = { path = "aether-authz" }
aether-telemetry = { path = "aether-telemetry" }
axum = { version = "0.7" }
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5" }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
