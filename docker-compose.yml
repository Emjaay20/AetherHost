services:
  postgres:
    image: postgres:16-alpine
    container_name: aetherhost-postgres
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether
      POSTGRES_DB: aetherhost
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aetherhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - control-plane-net

  redis:
    image: redis:7-alpine
    container_name: aetherhost-redis
    security_opt:
      - no-new-privileges:true
    command: redis-server --requirepass ${REDIS_PASSWORD:-aether-redis-local}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-aether-redis-local} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - control-plane-net

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3
    container_name: aetherhost-docker-proxy
    security_opt:
      - no-new-privileges:true
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      IMAGES: 1
      BUILD: 1
      VOLUMES: 1
      EXEC: 1
      POST: 1
      INFO: 1
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    networks:
      - control-plane-net

  traefik:
    image: traefik:v3.0
    container_name: aetherhost-traefik
    security_opt:
      - no-new-privileges:true
    command:
      - "--api.dashboard=false"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=aetherhost-net"
      - "--entrypoints.web.address=:80"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--entrypoints.metrics.address=:8082"
      - "--ping=true"
      - "--ping.entrypoint=metrics"
    ports:
      - "80:80"
      - "8082:8082"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entrypoint=metrics"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - aetherhost-net

  prometheus:
    image: prom/prometheus:v2.50.1
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - control-plane-net
      - aetherhost-net

  grafana:
    image: grafana/grafana:10.4.0
    security_opt:
      - no-new-privileges:true
    ports:
      - "3003:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - control-plane-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aetherhost-api
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://aether:aether@postgres:5432/aetherhost?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-aether-redis-local}
      - PORT=3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - control-plane-net
      - aetherhost-net

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: aetherhost-dashboard
    security_opt:
      - no-new-privileges:true
    ports:
      - "3002:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - aetherhost-net

  agent:
    build:
      context: .
      dockerfile: apps/agent-go/Dockerfile
    container_name: aetherhost-agent
    security_opt:
      - no-new-privileges:true
    depends_on:
      - docker-socket-proxy
    environment:
      - CONTROL_PLANE_URL=http://host.docker.internal:3000
      - AGENT_SECRET_KEY=${AGENT_SECRET_KEY:-aether-secret}
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - HOST_PWD=${PWD}
    volumes:
      - .:/app
      - ./deployments:/app/deployments
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - control-plane-net
      - aetherhost-net

networks:
  aetherhost-net:
    name: aetherhost-net
  control-plane-net:
    name: aetherhost-control-plane-net

volumes:
  pgdata:
