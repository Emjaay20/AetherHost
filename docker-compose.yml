services:
  postgres:
    image: postgres:16-alpine
    container_name: aetherhost-postgres
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether
      POSTGRES_DB: aetherhost
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aetherhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - control-plane-net

  redis:
    image: redis:7-alpine
    container_name: aetherhost-redis
    ports:
      - "6379:6379"
    networks:
      - control-plane-net

  traefik:
    image: traefik:latest
    container_name: aetherhost-traefik
    command:
      - "--api.dashboard=false"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=aetherhost-net"
      - "--entrypoints.web.address=:80"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--entrypoints.metrics.address=:8082"
    ports:
      - "80:80"
      - "8082:8082"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - aetherhost-net

  prometheus:
    image: prom/prometheus:v2.50.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml
    ports:
      - "9090:9090"
    networks:
      - control-plane-net
      - aetherhost-net

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3003:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/dashboards:/var/lib/grafana/dashboards
    networks:
      - control-plane-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aetherhost-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://aether:aether@postgres:5432/aetherhost?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3000
    ports:
      - "3000:3000"
    networks:
      - control-plane-net
      - aetherhost-net

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: aetherhost-dashboard
    ports:
      - "3002:3000"
    networks:
      - aetherhost-net

  agent:
    build:
      context: .
      dockerfile: apps/agent-go/Dockerfile
    container_name: aetherhost-agent
    environment:
      - CONTROL_PLANE_URL=http://host.docker.internal:3000
      - AGENT_SECRET_KEY=aether-secret
      - HOST_PWD=${PWD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
      - ./deployments:/app/deployments
    networks:
      - control-plane-net
      - aetherhost-net

networks:
  aetherhost-net:
    name: aetherhost-net
  control-plane-net:
    name: aetherhost-control-plane-net

volumes:
  pgdata:
