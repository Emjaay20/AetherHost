apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aether-platform-sync
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: aether-system
  prune: true
  wait: true
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: aetherhost
  path: ./deploy/gitops
