apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-platform
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: aether-router
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/aether-router"]
          ports:
            - name: http-edge
              containerPort: {{ .Values.service.routerPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /_aether/health
              port: http-edge
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /_aether/health
              port: http-edge
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: ROUTER_PORT
              value: "{{ .Values.env.ROUTER_PORT }}"
            - name: DEFAULT_BACKEND
              value: "{{ .Values.env.DEFAULT_BACKEND }}"
            - name: RUST_LOG
              value: "{{ .Values.env.RUST_LOG }}"
            - name: AGENT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aether-cluster-secrets
                  key: agent-secret-key
                  optional: true
        - name: aether-logd
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/aether-logd"]
          ports:
            - name: http-logd
              containerPort: {{ .Values.service.logdPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http-logd
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http-logd
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: PORT
              value: "{{ .Values.env.PORT }}"
            - name: RUST_LOG
              value: "{{ .Values.env.RUST_LOG }}"
