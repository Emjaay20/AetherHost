apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-platform
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.routerPort }}
      targetPort: http-edge
      protocol: TCP
      name: http-edge
    - port: {{ .Values.service.logdPort }}
      targetPort: http-logd
      protocol: TCP
      name: http-logd
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
