apiVersion: v1
kind: Pod
metadata:
  name: signed-platform-admission
  namespace: signed-image-test
spec:
  imagePullSecrets:
    - name: ghcr-read
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: platform
      image: __PLATFORM_IMAGE__
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
