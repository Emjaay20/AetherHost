version: '3'
services:
  gaming-backend:
    image: rust:latest
    working_dir: /app
    volumes:
      - .:/app
    command: cargo run --quiet
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=aetherhost-net"
      - "traefik.http.routers.gaming-backend.rule=Host(`gaming-backend.localhost`)"
      - "traefik.http.services.gaming-backend.loadbalancer.server.port=80"

  code-server:
    image: codercom/code-server:latest
    command: --auth none
    volumes:
      - .:/home/coder/project
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=aetherhost-net"
      - "traefik.http.routers.gaming-backend-ide.rule=Host(`gaming-backend-ide.localhost`)"
      - "traefik.http.services.gaming-backend-ide.loadbalancer.server.port=8080"
