server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html index.htm;

    location = /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    location = /fpm-ping {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /fpm-ping;
        fastcgi_param SCRIPT_NAME /fpm-ping;
        fastcgi_pass php:9000;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static file caching
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|woff2)$ {
        expires max;
        log_not_found off;
        access_log off;
    }

    # Rate limit login
    location = /wp-login.php {
        limit_req zone=wp_login burst=5 nodelay;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # FastCGI Caching
        fastcgi_cache WORDPRESS;
        fastcgi_cache_valid 200 60m;
        
        # Skip cache for logged in users
        fastcgi_cache_bypass $cookie_wordpress_logged_in;
        fastcgi_no_cache $cookie_wordpress_logged_in;
    }
}
