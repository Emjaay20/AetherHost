global:
  scrape_interval: 15s

rule_files:
  - "prometheus-alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "aetherhost-api"
    metrics_path: "/v1/metrics"
    static_configs:
      - targets: ["api:3000"]
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8082']
  - job_name: 'aetherhost-agent'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['agent:9108']
