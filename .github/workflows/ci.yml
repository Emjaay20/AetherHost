name: AetherHost CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typescript:
    name: API, Shared Libs & Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.21.0 --activate

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared libraries (strict TypeScript)
        run: |
          pnpm --filter @aetherhost/common build
          pnpm --filter @aetherhost/domain build

      - name: Generate Prisma client & typecheck API
        run: |
          pnpm --filter @aetherhost/api exec prisma generate
          pnpm --filter @aetherhost/api exec tsc -p tsconfig.build.json --noEmit

      - name: Run API unit & e2e tests
        run: |
          pnpm --filter @aetherhost/api test
          pnpm --filter @aetherhost/api test:e2e

      - name: Typecheck & test Dashboard
        run: |
          pnpm --filter dashboard exec tsc --noEmit
          pnpm --filter dashboard test

  go-agent:
    name: Go Runtime Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-go
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: apps/agent-go/go.sum

      - name: Run Go vet & unit tests
        run: |
          go vet ./...
          go test -v ./...

  rust-crates:
    name: Rust Crates (aether-core, aether-cli, aether-logd, aether-router)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Cargo check & unit tests
        run: |
          cargo test --workspace

  security:
    name: Security and Dependency Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect accidentally committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan source dependencies and configuration
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Start in reporting mode so existing dependency debt does not block
          # a safe deployment. Promote this to a blocking gate after findings
          # are triaged and documented.
          exit-code: '0'

  deploy:
    name: Continuous Deployment (Contabo VPS)
    needs: [typescript, go-agent, rust-crates, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production Host via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            bash /opt/aetherhost/deploy/deploy-production.sh
