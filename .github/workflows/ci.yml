name: AetherHost CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

# Jobs receive no write permissions unless one is explicitly required. This
# workflow only reads source and uses repository secrets for the deploy step.
permissions:
  contents: read

jobs:
  changes:
    name: Change Detection & Path Filter
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      go: ${{ steps.filter.outputs.go }}
      rust: ${{ steps.filter.outputs.rust }}
      terraform: ${{ steps.filter.outputs.terraform }}
      kubernetes: ${{ steps.filter.outputs.kubernetes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Evaluate Changed Paths
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            typescript:
              - 'apps/api/**'
              - 'apps/dashboard/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            go:
              - 'apps/agent-go/**'
            rust:
              - 'crates/**'
              - 'deny.toml'
              - 'Cargo.toml'
            terraform:
              - 'terraform/**'
            kubernetes:
              - 'deploy/helm/**'
              - 'deploy/gitops/**'
              - 'crates/**'

  typescript:
    name: API, Shared Libs & Dashboard
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - name: Skip check when unchanged
        if: github.event_name != 'push' && needs.changes.outputs.typescript != 'true'
        run: echo "No TypeScript changes detected; gating check passed."

      - name: Checkout repository
        if: github.event_name == 'push' || needs.changes.outputs.typescript == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Enable Corepack & pnpm
        if: github.event_name == 'push' || needs.changes.outputs.typescript == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@10.21.0 --activate

      - name: Setup Node.js 22 with pnpm cache
        if: github.event_name == 'push' || needs.changes.outputs.typescript == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        if: github.event_name == 'push' || needs.changes.outputs.typescript == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build shared libraries (strict TypeScript)
        if: github.event_name == 'push' || needs.changes.outputs.typescript == 'true'
        run: |
          pnpm --filter @aetherhost/common build
          pnpm --filter @aetherhost/domain build

      - name: Generate Prisma client & typecheck API
        if: github.event_name == 'push' || needs.changes.outputs.typescript == 'true'
        run: |
          pnpm --filter @aetherhost/api exec prisma generate
          pnpm --filter @aetherhost/api exec tsc -p tsconfig.build.json --noEmit
          pnpm --filter @aetherhost/api exec tsc -p tsconfig.security.json --noEmit

      - name: Run API unit & e2e tests
        if: github.event_name == 'push' || needs.changes.outputs.typescript == 'true'
        run: |
          pnpm --filter @aetherhost/api test
          pnpm --filter @aetherhost/api test:e2e

      - name: Typecheck & test Dashboard
        if: github.event_name == 'push' || needs.changes.outputs.typescript == 'true'
        run: |
          pnpm --filter dashboard exec tsc --noEmit
          pnpm --filter dashboard test

  go-agent:
    name: Go Runtime Agent
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - name: Skip check when unchanged
        if: github.event_name != 'push' && needs.changes.outputs.go != 'true'
        run: echo "No Go agent changes detected; gating check passed."

      - name: Checkout repository
        if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Go
        if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24'
          cache-dependency-path: apps/agent-go/go.sum

      - name: Run Go vet & unit tests
        if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
        working-directory: apps/agent-go
        run: |
          go vet ./...
          go test -v ./...

  rust-crates:
    name: Rust Crates (aether-core, aether-cli, aether-logd, aether-router)
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - name: Skip check when unchanged
        if: github.event_name != 'push' && needs.changes.outputs.rust != 'true'
        run: echo "No Rust changes detected; gating check passed."

      - name: Checkout repository
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Rust toolchain
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies & build artifacts
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          workspaces: crates -> target

      - name: Install cargo-nextest
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        uses: taiki-e/install-action@d75f3433052800716ea4e9618494c31d16de4188

      - name: Check Rust dependencies & licenses (cargo-deny)
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9
        with:
          manifest-path: crates/Cargo.toml

      - name: Enforce strict platform clippy lints
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        working-directory: crates
        run: |
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Cargo workspace tests with cargo-nextest
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        working-directory: crates
        run: |
          cargo nextest run --workspace

      - name: Run Cargo doc tests
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        working-directory: crates
        run: |
          cargo test --doc --workspace

  security:
    name: Security and Dependency Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Validate security policy and exception lifecycle
        run: python3 scripts/security/check-policy.py

      - name: Test security policy and release rejection paths
        run: python3 -m unittest discover -s scripts/security -p 'test_*.py'

      - name: Detect accidentally committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan source dependencies and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore
          exit-code: '1'

  terraform-checkov:
    name: Terraform Security Analysis (Checkov)
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - name: Skip check when unchanged
        if: github.event_name != 'push' && needs.changes.outputs.terraform != 'true'
        run: echo "No Terraform changes detected; gating check passed."

      - name: Checkout repository
        if: github.event_name == 'push' || needs.changes.outputs.terraform == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Terraform
        if: github.event_name == 'push' || needs.changes.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.9.8

      - name: Validate independent Terraform roots
        if: github.event_name == 'push' || needs.changes.outputs.terraform == 'true'
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
          terraform -chdir=terraform/aws-security-lab init -backend=false
          terraform -chdir=terraform/aws-security-lab validate

      - name: Run Checkov on Terraform Code
        if: github.event_name == 'push' || needs.changes.outputs.terraform == 'true'
        uses: bridgecrewio/checkov-action@b17b606d6ec72bb8ba5721ad5b7e340b80a9fc39
        with:
          framework: terraform
          directory: terraform
          # The AWS security lab is intentionally not connected to this VPS or
          # any AWS account. It is syntax-validated above; account-level
          # controls become a hard policy gate after a reviewed AWS rollout.
          skip_path: terraform/aws-security-lab
          output_format: cli
          soft_fail: false

  kubernetes-ci:
    name: Kubernetes KinD & Helm Deployment Validation
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - name: Skip check when unchanged
        if: github.event_name != 'push' && needs.changes.outputs.kubernetes != 'true'
        run: echo "No Kubernetes / platform changes detected; gating check passed."

      - name: Checkout repository
        if: github.event_name == 'push' || needs.changes.outputs.kubernetes == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Helm
        if: github.event_name == 'push' || needs.changes.outputs.kubernetes == 'true'
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814
        with:
          version: 'v3.16.4'

      - name: Lint Platform Helm Chart
        if: github.event_name == 'push' || needs.changes.outputs.kubernetes == 'true'
        run: |
          helm lint deploy/helm/aether-platform --set image.requireDigest=false

      - name: Install Kubeconform
        if: github.event_name == 'push' || needs.changes.outputs.kubernetes == 'true'
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Validate Helm Chart and GitOps Manifests with Kubeconform
        if: github.event_name == 'push' || needs.changes.outputs.kubernetes == 'true'
        run: |
          helm template test-release deploy/helm/aether-platform --namespace aether-system --set image.requireDigest=false | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0
          kubeconform -summary -ignore-missing-schemas deploy/gitops/

      - name: Create KinD Cluster
        if: github.event_name == 'push' || needs.changes.outputs.kubernetes == 'true'
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3
        with:
          cluster_name: aether-kind
          version: v0.25.0
          node_image: kindest/node:v1.31.2

      - name: Build Platform Docker Image
        if: github.event_name == 'push' || needs.changes.outputs.kubernetes == 'true'
        run: |
          docker build -t ghcr.io/emjaay20/aether-platform:latest -f crates/Dockerfile .

      - name: Load Image into KinD
        if: github.event_name == 'push' || needs.changes.outputs.kubernetes == 'true'
        run: |
          kind load docker-image ghcr.io/emjaay20/aether-platform:latest --name aether-kind

      - name: Install Platform Helm Chart
        if: github.event_name == 'push' || needs.changes.outputs.kubernetes == 'true'
        run: |
          kubectl apply -f deploy/gitops/namespace.yaml
          ci_identity_token="$(openssl rand -hex 32)"
          printf 'CI_IDENTITY_TOKEN=%s\n' "$ci_identity_token" >> "$GITHUB_ENV"
          identities_json="$(printf '{\"credentials\":[{\"token\":\"%s\",\"subject_id\":\"ci\",\"tenant_id\":\"ci\",\"role\":\"developer\",\"expires_at\":4102444800}],\"resources\":{}}' "$ci_identity_token")"
          kubectl create secret generic aether-cluster-secrets -n aether-system \
            --from-literal=agent-secret-key="$ci_identity_token" \
            --from-literal=identities.json="$identities_json"
          # Server-side admission must reject an insecure root/privileged pod.
          if kubectl apply --dry-run=server -n aether-system -f scripts/security/fixtures/privileged-pod.yaml 2>admission-error.txt; then
            echo "Restricted admission accepted a privileged workload" >&2
            exit 1
          fi
          grep -q 'violates PodSecurity' admission-error.txt || { cat admission-error.txt; exit 1; }
          helm install aether-platform deploy/helm/aether-platform \
            --namespace aether-system \
            --set image.requireDigest=false \
            --set image.tag=latest \
            --set image.pullPolicy=Never \
            --set autoscaling.enabled=false \
            --set replicaCount=1 \
            --set serviceMonitor.enabled=false \
            --wait --timeout=180s

      - name: Verify Rollout Status
        if: github.event_name == 'push' || needs.changes.outputs.kubernetes == 'true'
        run: |
          kubectl rollout status deployment/aether-platform-platform -n aether-system --timeout=120s
          kubectl get pods -n aether-system -o wide
          kubectl get svc -n aether-system

      - name: Smoke-Test Health & Telemetry Endpoints
        if: github.event_name == 'push' || needs.changes.outputs.kubernetes == 'true'
        run: |
          kubectl port-forward svc/aether-platform-platform 8080:8080 4001:4001 -n aether-system &
          PF_PID=$!
          sleep 4

          # Test router health & metrics
          curl -sf http://127.0.0.1:8080/_aether/health
          auth_scheme='Bearer'
          auth_header="Authorization: ${auth_scheme} ${CI_IDENTITY_TOKEN}"
          curl -sf --header "$auth_header" http://127.0.0.1:8080/_aether/metrics | grep "http_requests"

          # Test logd health & metrics
          curl -sf http://127.0.0.1:4001/health | grep "healthy"
          curl -sf --header "$auth_header" http://127.0.0.1:4001/metrics | grep "http_requests"

          kill $PF_PID || true

  publish:
    name: Publish approved release
    needs: [typescript, go-agent, rust-crates, security, terraform-checkov, kubernetes-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/publish-images.yml

  deploy:
    name: Deploy verified release
    needs: [publish]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Require pinned SSH host identity
        env:
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          if [[ "$SSH_HOST_FINGERPRINT" != SHA256:* ]]; then
            echo "Configure a trusted SHA256 SSH_HOST_FINGERPRINT before deployment." >&2
            exit 1
          fi

      - name: Deploy approved revision through restricted entry point
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: sudo /srv/aetherhost/control/deploy/deploy-production.sh '${{ github.sha }}'
