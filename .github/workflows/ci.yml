name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_ci_placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.4"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @aetherhost/api exec prisma generate

      - name: Test API
        run: pnpm --filter @aetherhost/api test

      - name: Build API
        run: pnpm --filter @aetherhost/api build

      - name: Test and build Go agent
        working-directory: apps/agent-go
        run: |
          go test ./...
          go build -o agent .

      - name: Build dashboard
        run: pnpm --filter dashboard build
