name: AetherHost CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Jobs receive no write permissions unless one is explicitly required. This
# workflow only reads source and uses repository secrets for the deploy step.
permissions:
  contents: read

jobs:
  typescript:
    name: API, Shared Libs & Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Enable Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.21.0 --activate

      - name: Setup Node.js 22
        # v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared libraries (strict TypeScript)
        run: |
          pnpm --filter @aetherhost/common build
          pnpm --filter @aetherhost/domain build

      - name: Generate Prisma client & typecheck API
        run: |
          pnpm --filter @aetherhost/api exec prisma generate
          pnpm --filter @aetherhost/api exec tsc -p tsconfig.build.json --noEmit

      - name: Run API unit & e2e tests
        run: |
          pnpm --filter @aetherhost/api test
          pnpm --filter @aetherhost/api test:e2e

      - name: Typecheck & test Dashboard
        run: |
          pnpm --filter dashboard exec tsc --noEmit
          pnpm --filter dashboard test

  go-agent:
    name: Go Runtime Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-go
    steps:
      - name: Checkout repository
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Go
        # v5.6.0
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24'
          cache-dependency-path: apps/agent-go/go.sum

      - name: Run Go vet & unit tests
        run: |
          go vet ./...
          go test -v ./...

  rust-crates:
    name: Rust Crates (aether-core, aether-cli, aether-logd, aether-router)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - name: Checkout repository
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Rust toolchain
        # stable branch, pinned at 2026-11-11
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - name: Run Cargo check & unit tests
        run: |
          cargo test --workspace

  security:
    name: Security and Dependency Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Detect accidentally committed secrets
        # v2.3.9
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        # The scanner remains visible while the previously committed Svix
        # secret is rotated and historical exposure is remediated. Make it a
        # gate only after that baseline is clean.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan source dependencies and configuration
        # v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Start in reporting mode so existing dependency debt does not block
          # a safe deployment. Promote this to a blocking gate after findings
          # are triaged and documented.
          exit-code: '0'

  deploy:
    name: Continuous Deployment (Contabo VPS)
    needs: [typescript, go-agent, rust-crates, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production Host via SSH
        # v1.2.0
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            bash /srv/aetherhost/control/deploy/deploy-production.sh
