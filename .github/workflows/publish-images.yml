name: Publish & Sign Container Images

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    name: Build, Sign & Push Container Images to GHCR
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aetherhost-api
            context: .
            dockerfile: apps/api/Dockerfile
          - name: aetherhost-dashboard
            context: .
            dockerfile: apps/dashboard/Dockerfile
          - name: aether-platform
            context: .
            dockerfile: crates/Dockerfile
          - name: aetherhost-agent
            context: .
            dockerfile: apps/agent-go/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner for OCI reference
        id: repo_owner
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Extract container metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804
        with:
          images: ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ github.sha }}


      - name: Build and push container image
        id: build-and-push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_BASE_DOMAIN=${{ vars.NEXT_PUBLIC_BASE_DOMAIN }}
            NEXT_PUBLIC_USE_TRAEFIK=true

      - name: Scan built image before signing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.name }}@${{ steps.build-and-push.outputs.digest }}
          severity: HIGH,CRITICAL
          # A release is blocked by every vulnerability with an available
          # remediation. Findings without a vendor fix remain visible in the
          # scheduled posture reports and require an expiring exception.
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

      - name: Sign container image with Cosign
        run: |
          cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
        env:
          IMAGE_NAME: ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.name }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}

      - name: Generate and attach SBOM
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with:
          image: ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.name }}@${{ steps.build-and-push.outputs.digest }}
          format: spdx-json
